services:
  scheduleserver:
    image: scheduleserver
    build:
      context: ..
      dockerfile: ScheduleServer/Dockerfile
    ports:
      - "5287:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__ScheduleContext=Host=postgres;Port=5432;Database=schedule;Username=schedule;Password=schedule
  postgres:
    image: postgres:latest
    container_name: schedule-postgres
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
