product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]


dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.jetbrains.navigation3.ui
  - $libs.jetbrains.lifecycle.viewmodelNavigation3
  - $libs.jetbrains.material3.adaptiveNavigation3
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.koin.compose.navigation3
  - $libs.kotlinx.coroutines.core
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.kotlinx.datetime
  - $libs.datastore.core
  - $libs.datastore.preferences.core

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.cio

dependencies@web:
  - $libs.navigation3.browser
  - $libs.ktor.client.js

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@ios:
  - $libs.ktor.client.cio

settings:
  compose:
    enabled: true
    resources:
      packageName: com.moshk.schedule.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization: enabled
